services:
  db:
    image: postgres:16-alpine
    container_name: leanchem-db
    environment:
      POSTGRES_USER: leanchem
      POSTGRES_PASSWORD: leanchem
      POSTGRES_DB: leanchem
    ports:
      - "5432:5432"
    volumes:
      - leanchem_pg:/var/lib/postgresql/data
      - ./db/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./db/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leanchem -d leanchem"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  leanchem_pg:
